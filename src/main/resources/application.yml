server:
  port: ${PORT:8084}
  servlet:
    session:
      timeout: 600s

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  datasource:
    url: jdbc:mysql://${BLOG_DB_HOST:localhost}:${BLOG_DB_PORT:3306}/${BLOG_DB_NAME:blog}?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.qq.com
    username: ${BLOG_EMAIL_USERNAME:3388659470@qq.com}
    password: ${BLOG_EMAIL_PASSWORD:}
    port: 465
    default-encoding: UTF-8
    protocol: smtps
    properties:
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 3000
      "mail.smtp.writetimeout": 5000
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true
      "mail.smtp.starttls.required": true
  data:
    redis:
      host: ${BLOG_REDIS_HOST:localhost}
      port: ${BLOG_REDIS_PORT:6379}
      timeout: 10000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.bilibili.myblogbackend.dto

minio:
  blog:
    endpoint: ${BLOG_OSS_ENDPOINT:https://26eb63e68f7f9cdff6afc974471f6585.r2.cloudflarestorage.com}
    accessKey: ${BLOG_OSS_ACCESSKEY:e6aac7d6150e05b303783954538a61f0}
    secretKey: ${BLOG_OSS_SECRETKEY:0206e05dd784abac63408b0d46d245b7034664879827f00856579a802a2f6c11}
    bucketsName: ${BLOG_OSS_BUCKETSNAME:blog}
    image: ${BLOG_OSS_IMAGE:image/}
    video: ${BLOG_OSS_VIDEO:video/}

# CORS 允许的来源，生产部署时通过环境变量设置前端域名
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
